plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = 'net.darkhax.openloader'

base { archivesName = 'OpenLoader-fabric-26.2' }

repositories { mavenCentral() }

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation files('libs/PrickleMC-fabric-MC26.2-26.2.0.3.jar')
	compileOnly 'org.jetbrains:annotations:24.1.0'
}

sourceSets {
	main {
		java.srcDirs = ['common/src/main/java', 'fabric/src/main/java']
		resources.srcDirs = ['kathaus/resources']
	}
}

tasks.withType(JavaCompile).configureEach { it.options.release = 25 }

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar { from('LICENSE') { rename { "${it}_OpenLoader" } } }
